name: Generate DoH LOINC mapping

on:
  push:
    branches: [main]
    paths:
      - "scripts/generate_loinc_mapping.py"
      - "resources/Codes-LOINC.xlsx"
      - ".github/workflows/generate-loinc-mapping.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert official workbook to JSON
        run: python3 scripts/generate_loinc_mapping.py
      - name: Commit regenerated mapping
        run: |
          git add json/loinc_code_mapping.json json/loinc_dictionary
          if git diff --cached --quiet; then
            echo "Mapping is already current"
          else
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Regenerate DoH LOINC code mappings from resources workbook"
            git push
          fi
