<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Eligibility Checker</title>
  <link rel="stylesheet" href="../css/tables.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <h1>Eligibility Checker</h1>
  <!-- Explanation Box -->
  <div id="explanation" style="border:1px solid #ccc; border-radius:6px; padding:16px; background:#f8f8fa; margin-bottom:20px;">
    <p>To be filled.</p>
  </div>

  <div>
    <label>
      <input type="radio" name="reportSource" value="xls" checked>
      Upload Report (Clinicpro, Odoo, or InstaHMS)
    </label>
    <label>
      <input type="radio" name="reportSource" value="xml">
      Upload XML Report
    </label>
  </div>
  <br>
  <div id="xmlReportInputGroup" style="display:none;">
    <label for="xmlFileInput">Upload XML Report:</label>
    <input type="file" id="xmlFileInput" accept=".xml"/>
  </div>
  <div id="reportInputGroup">
    <label for="reportInputGroup">Upload Report (Clinicpro, Odoo, or InstaHMS):</label>
    <input type="file" id="reportFileInput" multiple accept=".xls,.xlsx,.csv" />
  </div>
  <div id="eligibilityInputGroup" style="margin-top:10px;">
    <label for="eligibilityFileInput">Upload Eligibility XLSX:</label>
    <input type="file" id="eligibilityFileInput" accept=".xlsx"/>
  </div>
  <div>
    <button id="processBtn" disabled>Process</button>
    <button id="exportInvalidBtn" disabled>Export Invalid Rows</button>
  </div>
  <div id="uploadStatus" style="margin-top:12px; color:#0074D9;"></div>
  <div id="results" style="margin-top:20px;"></div>
  <script src="../js/checker_elig.js"></script>
  <script src="../js/table_clipboard.js"></script>
  <script>
    // Standalone eligibility checker: the report/XML radio controls the source.
    // This page formerly had no input handlers, leaving Process disabled.
    (function () {
      const radioInputs = Array.from(document.querySelectorAll('input[name="reportSource"]'));
      const reportInput = document.getElementById('reportFileInput');
      const xmlInput = document.getElementById('xmlFileInput');
      const eligibilityInput = document.getElementById('eligibilityFileInput');
      const reportGroup = document.getElementById('reportInputGroup');
      const xmlGroup = document.getElementById('xmlReportInputGroup');
      const runButton = document.getElementById('processBtn');
      const resultBox = document.getElementById('results');
      const status = document.getElementById('uploadStatus');
      let working = false;
      const mode = () => document.querySelector('input[name="reportSource"]:checked')?.value || 'xls';
      function refresh() {
        const useReport = mode() === 'xls';
        reportGroup.style.display = useReport ? '' : 'none';
        xmlGroup.style.display = useReport ? 'none' : '';
        const hasSource = useReport ? reportInput.files.length > 0 : xmlInput.files.length > 0;
        runButton.disabled = working || !hasSource || !eligibilityInput.files.length;
      }
      [...radioInputs, reportInput, xmlInput, eligibilityInput].forEach(input => {
        input.addEventListener('change', refresh);
      });
      runButton.addEventListener('click', async function () {
        if (runButton.disabled || working) return;
        working = true;
        refresh();
        status.textContent = 'Checking claims against eligibility…';
        try {
          const result = await window.runEligCheck({ sourceType: mode() });
          resultBox.replaceChildren(result);
          status.textContent = '';
        } catch (error) {
          status.textContent = 'Eligibility check failed: ' + String(error?.message || error);
        } finally {
          working = false;
          refresh();
        }
      });
      refresh();
    })();
  </script>
</body>
</html>
